plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.zsk.wechatalert'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.zsk.wechatalert'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
